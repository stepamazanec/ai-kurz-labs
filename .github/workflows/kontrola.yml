   name: kontrola
   on:
     pull_request:
     push:
       branches: [main]
   jobs:
     syntax:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v5        # stáhne kód repozitáře
         - uses: actions/setup-python@v6
           with:
             python-version: "3.12"
         - run: python -m compileall -q .   # selže při syntaktické chybě
